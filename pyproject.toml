[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "murmell"
version = "0.3.0"
description = "Localise invisible provenance watermarks in edited images on CPU"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Wassim Badraoui"}]
dependencies = [
    "numpy>=1.24,<3",
    "Pillow>=10,<13",
    "segmentation-models-pytorch==0.6.0",
    "torch>=2.5,<3",
    "torchvision>=0.20,<1",
    "trustmark==0.9.2",
]

[project.optional-dependencies]
app = ["gradio>=6.32,<7"]
onnx = ["onnx==1.17.0", "onnxruntime==1.20.1"]
dev = ["pytest>=8,<10", "ruff==0.15.11", "mypy==1.19.1", "pre-commit==4.5.0", "build>=1.2,<2"]
showcase = ["playwright>=1.50,<2"]

[project.urls]
Repository = "https://github.com/Wassbdr/murmell"
Issues = "https://github.com/Wassbdr/murmell/issues"

[project.scripts]
murmell-detect = "murmell.cli:main"
murmell-export = "murmell.onnx:main"

[tool.setuptools]
packages = ["murmell"]

[tool.setuptools.package-data]
murmell = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 120
include = [
    "benchmarks/report_invisible.py",
    "murmell/*.py",
    "showcase/*.py",
    "task1_watermark_localisation/app.py",
    "task1_watermark_localisation/src/invisible_*.py",
    "task1_watermark_localisation/tests/test_invisible.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
files = ["murmell"]
ignore_missing_imports = true
disallow_untyped_defs = true
